<style>
/* Layout: full-bleed first-person 3D stage. One caption line in the lower third, one door button at the bottom.
   Single dark look by choice: lamp amber on warm black. No floor indicator anywhere. */
:root{
  --bg:#0a0908;
  --ink:#ebe4d4;
  --dim:#9a917f;
  --lamp:#e8c88a;
  --panel:#171513;
  --line:#3a342c;
  --serif:'Gowun Batang','Noto Serif KR',Georgia,serif;
  --sans:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1.1rem;padding:1rem 1rem 6vh}
#fade{position:fixed;inset:0;z-index:4;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#pickprompt{position:fixed;left:0;top:0;transform:translate(14px,20px);z-index:3;pointer-events:none;font-family:var(--sans);font-size:.95rem;letter-spacing:.06em;color:var(--lamp);text-shadow:0 1px 8px #000;opacity:0;transition:opacity .15s;white-space:nowrap}
#inv{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:.5rem}
.slot{position:relative;width:3.6rem;height:3.6rem;border-radius:.6rem;background:rgba(23,21,19,.82);border:1px solid var(--line);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:var(--sans)}
.slot img{width:2.6rem;height:2.6rem;pointer-events:none}
.slot .k{position:absolute;left:.35rem;top:.2rem;font-size:.65rem;color:var(--dim)}
.slot .n{position:absolute;right:.35rem;bottom:.2rem;font-size:.8rem;font-weight:600}
.slot:hover:not(.empty){border-color:var(--lamp)}
.slot.empty{cursor:default}
.slot:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.slot.held{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp) inset}
#pianobadge{position:fixed;left:50%;top:calc(.9rem + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;max-width:calc(100vw - 14rem);text-align:center;font-family:var(--sans);font-size:.78rem;line-height:1.5;color:var(--dim);background:rgba(23,21,19,.75);border:1px solid var(--line);border-radius:.5rem;padding:.35rem .8rem;pointer-events:none}
#cap{margin:0;max-width:34rem;text-align:center;font-family:var(--serif);font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.6;color:var(--ink);text-shadow:0 1px 14px #000,0 0 3px #000;opacity:0;transition:opacity .8s;text-wrap:balance;min-height:3.2em}
#cap.show{opacity:1}
#start:focus-visible,#snd:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
#tl{position:fixed;top:calc(.9rem + env(safe-area-inset-top,0px));left:1rem;z-index:5;display:flex;gap:.4rem}
#tl button{font-family:var(--sans);font-size:.8rem;color:var(--dim);background:rgba(23,21,19,.7);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;cursor:pointer}
#tl button[hidden]{display:none}
#snd{position:fixed;top:calc(.9rem + env(safe-area-inset-top,0px));right:1rem;z-index:5;font-family:var(--sans);font-size:.8rem;color:var(--dim);background:rgba(23,21,19,.7);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;cursor:pointer}
#intro{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:1rem;background:#0a0908;transition:opacity 1.1s .5s;overflow:hidden}
#intro.gone{opacity:0;pointer-events:none}
#intro .dl,#intro .dr{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#2a2926,#3a3834 45%,#232220);transition:transform 1.3s cubic-bezier(.6,0,.3,1)}
#intro .dl{left:0;border-right:2px solid #0a0908}
#intro .dr{right:0;border-left:2px solid #0a0908}
#intro .dl::after,#intro .dr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px)}
#intro.gone .dl{transform:translateX(-101%)}
#intro.gone .dr{transform:translateX(101%)}
#intro .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(232,200,138,.14),rgba(10,9,8,.7) 70%);pointer-events:none}
.card{position:relative;max-width:30rem;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.2rem;transition:opacity .5s}
#intro.gone .card{opacity:0}
.card .logo{display:block;width:auto;height:auto;max-width:min(24rem,84vw);max-height:42vh;border-radius:.9rem;border:1px solid var(--line);box-shadow:0 0 40px rgba(232,200,138,.25),0 10px 30px #000}
.card .eyebrow{font-family:var(--sans);font-size:.78rem;letter-spacing:.5em;color:var(--dim);margin:0 0 -.3rem .5em}
.card h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(2.3rem,9vw,3.6rem);letter-spacing:-.02em;color:var(--lamp);line-height:1.15;text-shadow:0 0 28px rgba(232,200,138,.35)}
.card h1 span{display:block;font-size:.62em;letter-spacing:.3em;margin-top:.35em;color:var(--ink);text-shadow:none}
.card .rule{width:5rem;height:1px;background:var(--lamp);opacity:.6;border:0;margin:.2rem 0}
.card p{margin:0;font-family:var(--serif);font-size:1.02rem;line-height:1.75;color:var(--ink)}
.card small{font-size:.82rem;line-height:1.8;color:var(--dim)}
.menu{display:flex;flex-direction:column;align-items:stretch;gap:.7rem;width:min(16rem,100%);margin-top:.4rem}
.menu button.sec{font-family:var(--sans);font-size:.92rem;letter-spacing:.12em;color:var(--ink);background:rgba(23,21,19,.7);border:1px solid var(--line);border-radius:999px;padding:.7rem 1.4rem;cursor:pointer}
.menu button.sec:hover{border-color:var(--lamp);color:var(--lamp)}
.menu button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
#how{display:none;padding:1rem 1.2rem;background:rgba(23,21,19,.85);border:1px solid var(--line);border-radius:.8rem}
#how.show{display:block}
#start{font-family:var(--sans);font-weight:600;font-size:1rem;letter-spacing:.08em;color:#1a150d;background:var(--lamp);border:0;border-radius:999px;padding:.85rem 2.4rem;cursor:pointer}
#start:hover{background:#f3dba7}
#joy{display:none;position:fixed;left:22px;bottom:96px;width:200px;height:200px;border-radius:50%;z-index:30;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(circle,rgba(20,20,26,.35),rgba(20,20,26,.55));border:2px solid rgba(255,255,255,.3)}
#joyknob{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(243,219,167,.72);border:1px solid rgba(255,255,255,.55);pointer-events:none;will-change:transform}
@media (hover:none) and (pointer:coarse){#joy.show{display:block}}
#wrap{position:fixed;inset:0;transform:translateZ(0);overflow:hidden}
body.wide{background:#000}
@media (max-height:480px){
  #tl{top:.35rem;left:.5rem;gap:.3rem}
  #tl button,#snd{font-size:.68rem;padding:.22rem .6rem}
  #snd{top:.35rem;right:.5rem}
  #intro{padding:.5rem}
  .card{max-width:40rem;display:grid;grid-template-columns:auto 1fr;column-gap:1.4rem;row-gap:.5rem;align-content:center;align-items:center}
  .card .logo{grid-row:1 / span 3;grid-column:1;max-height:84vh;max-width:38vw}
  .card h1{grid-column:2;font-size:clamp(1.3rem,4vw,1.9rem);white-space:nowrap}
  .menu{grid-column:2;margin-top:0}
  #how{grid-column:2}
  .slot{width:2.8rem;height:2.8rem}
  .slot img{width:2rem;height:2rem}
  #inv{bottom:.5rem}
  #joy{bottom:66px;width:168px;height:168px}
  #joyknob{width:70px;height:70px;margin:-35px 0 0 -35px}
}
@media (prefers-reduced-motion:reduce){#cap,#intro{transition:none}}
</style>

<div id="wrap">
<div id="stage"></div>
<div id="fade"></div>
<div id="joy"><div id="joyknob"></div></div>

<div id="hud" hidden>
</div>

<div id="tl"><button id="fsn" type="button" hidden>전체화면</button><button id="fs" type="button" hidden>전체화면</button></div>
<button id="snd" type="button" aria-pressed="true">소리 켜짐</button>
<div id="pickprompt"></div>
<div id="pianobadge" hidden></div>
<div id="inv" hidden></div>

<div id="intro">
  <div class="dl"></div><div class="dr"></div><div class="vig"></div>
  <div class="card">
    <img class="logo" src="theater-assets/logo.jpg" alt="초카구야공주! 엘리베이터">
    <h1>초카구야공주!<span>엘리베이터</span></h1>
    <div class="menu">
      <button id="start" type="button">탑승하기</button>
      <button id="howbtn" class="sec" type="button" aria-expanded="false">조작 방법</button>
    </div>
    <small id="how">WASD 또는 화면 방향키로 이동 · 드래그나 방향키로 둘러보기 · 마우스(터치)로 물건 줍기 · 칸을 눌러 들고 클릭하면 먹기 · 문이 열려 있는 동안은 밖으로 나갈 수 있고, 닫히면 기다립니다 · 소리가 나옵니다</small>
  </div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const R = Math.random, TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rr = (a, b) => a + R() * (b - a);
const $ = id => document.getElementById(id);

/* ---------- renderer / scene ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.Fog(0x050505, 5, 16);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 120);
camera.rotation.order = 'YXZ';
const wrapEl = $('wrap');
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  let w = iw, h = ih;
  if (document.body.classList.contains('wide')) {
    w = Math.min(iw, ih * 16 / 9); h = w * 9 / 16;
    Object.assign(wrapEl.style, { left: ((iw - w) / 2) + 'px', top: ((ih - h) / 2) + 'px', width: w + 'px', height: h + 'px', right: 'auto', bottom: 'auto' });
  } else wrapEl.style.cssText = '';
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 82 : 70;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ---------- helpers ---------- */
const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.8, metalness: 0.05 }, o));
const B = (mat, w, h, d, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
};
function disposeObj(o) {
  o.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    if (c.material) (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  });
}

/* ---------- audio ---------- */
let AC = null, master = null, humG = null, muted = false;
function audio() {
  if (!AC) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    AC = new Ctx();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.55;
    master.connect(AC.destination);
    humG = AC.createGain();
    humG.gain.value = 0;
    humG.connect(master);
    [55, 82.5].forEach((f, i) => {
      const o = AC.createOscillator();
      o.type = i ? 'triangle' : 'sine';
      o.frequency.value = f;
      const g = AC.createGain();
      g.gain.value = i ? 0.25 : 0.6;
      o.connect(g).connect(humG);
      o.start();
    });
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, d = 0.3, type = 'sine', v = 0.15, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(master);
  o.start(t);
  o.stop(t + d + 0.05);
}
function noise(d = 0.2, v = 0.1, f = 800, delay = 0) {
  if (!AC) return;
  const n = Math.max(1, (AC.sampleRate * d) | 0);
  const b = AC.createBuffer(1, n, AC.sampleRate), c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (R() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource();
  s.buffer = b;
  const fl = AC.createBiquadFilter();
  fl.type = 'lowpass';
  fl.frequency.value = f;
  const g = AC.createGain();
  g.gain.value = v;
  s.connect(fl).connect(g).connect(master);
  s.start(AC.currentTime + delay);
}
const sfx = {
  ding() { tone(988, 1.5, 'sine', 0.16); tone(1976, 1.1, 'sine', 0.04); },
  door() { noise(0.9, 0.09, 420); },
  knock() { [0.3, 0.85, 1.4].forEach(d => { tone(130, 0.12, 'square', 0.12, -60, d); noise(0.08, 0.15, 500, d); }); },
  thud() { tone(70, 0.25, 'sine', 0.22, -30); },
  low() { tone(48, 1.4, 'sine', 0.25, -10); },
  drip() { tone(rr(1000, 1700), 0.09, 'sine', 0.05, -500); },
  chirp() { const f = rr(2200, 3600); tone(f, 0.09, 'sine', 0.05, 500); tone(f * 1.1, 0.08, 'sine', 0.04, -400, 0.12); },
  pop() { noise(0.12, 0.2, 2400); tone(300, 0.08, 'triangle', 0.1, -150); },
  siren() {
    if (!AC) return () => {};
    const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.value = 780;
    g.gain.value = 0.025;
    lp.type = 'lowpass';
    lp.frequency.value = 900;
    o.connect(lp).connect(g).connect(master);
    o.start();
    let k = 0;
    const iv = setInterval(() => o.frequency.setTargetAtTime(k++ % 2 ? 560 : 780, AC.currentTime, 0.08), 600);
    return () => { clearInterval(iv); try { g.gain.setTargetAtTime(0, AC.currentTime, 0.05); o.stop(AC.currentTime + 0.4); } catch (e) {} };
  }
};
function setHum(v) { if (humG) humG.gain.setTargetAtTime(v, AC.currentTime, 0.4); }

/* ---------- the elevator ---------- */
const elev = new THREE.Group();
scene.add(elev);
const steel = M(0x8c8a84, { metalness: 0.55, roughness: 0.45 });
const darkMat = M(0x2a2825, { metalness: 0.3, roughness: 0.6 });
const floorTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#2b2926'; x.fillRect(0, 0, 128, 128);
  x.fillStyle = '#35322d'; x.fillRect(0, 0, 64, 64); x.fillRect(64, 64, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  return t;
})();
elev.add(B(M(0xffffff, { map: floorTex, roughness: 0.5, metalness: 0.2 }), 2.2, 0.1, 2.2, 0, -0.05, 0));
elev.add(B(steel, 2.3, 2.5, 0.1, 0, 1.25, 1.15));
elev.add(B(steel, 0.1, 2.5, 2.3, -1.15, 1.25, 0));
elev.add(B(steel, 0.1, 2.5, 2.3, 1.15, 1.25, 0));
elev.add(B(darkMat, 2.3, 0.1, 2.3, 0, 2.55, 0));
const lampMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffe6bd, emissiveIntensity: 1 });
elev.add(B(lampMat, 1, 0.02, 1, 0, 2.49, 0));
elev.add(B(steel, 0.55, 2.5, 0.1, -0.825, 1.25, -1.15));
elev.add(B(steel, 0.55, 2.5, 0.1, 0.825, 1.25, -1.15));
elev.add(B(steel, 1.1, 0.3, 0.1, 0, 2.35, -1.15));
elev.add(B(M(0x15181a, { metalness: 0.9, roughness: 0.15 }), 1.6, 1.2, 0.02, 0, 1.35, 1.09));
const doorMat = M(0x9b988f, { metalness: 0.6, roughness: 0.4 });
const panelL = B(doorMat, 0.55, 2.2, 0.05, -0.275, 1.1, -1.13);
const panelR = B(doorMat, 0.55, 2.2, 0.05, 0.275, 1.1, -1.13);
elev.add(panelL, panelR);
const rail = (len, x, y, z, rotY) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, len, 8), M(0xb9b6ab, { metalness: 0.8, roughness: 0.25 }));
  m.rotation.z = Math.PI / 2;
  const g = new THREE.Group();
  g.add(m);
  g.position.set(x, y, z);
  g.rotation.y = rotY;
  return g;
};
elev.add(rail(1.9, 0, 0.95, 1.05, 0), rail(1.9, -1.07, 0.95, 0, Math.PI / 2), rail(1.9, 1.07, 0.95, 0, Math.PI / 2));
// button plate: dots only, no numerals, no floor display
elev.add(B(darkMat, 0.03, 0.5, 0.26, 1.085, 1.2, -0.62));
const btnMats = [];
for (let i = 0; i < 6; i++) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0xe8a050, emissiveIntensity: 0.15 });
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), mat);
  b.position.set(1.065, 1.05 + Math.floor(i / 2) * 0.14, -0.7 + (i % 2) * 0.16);
  elev.add(b);
  btnMats.push(mat);
}
// countdown screen, right of the door (looks like an indicator screen, shows time instead of a floor)
const tcv = document.createElement('canvas');
tcv.width = 256; tcv.height = 128;
const tctx = tcv.getContext('2d');
const tTex = new THREE.CanvasTexture(tcv);
elev.add(B(M(0x0c0b0a, { metalness: 0.4, roughness: 0.5 }), 0.46, 0.28, 0.03, 0.82, 1.78, -1.085));
const tScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.2), new THREE.MeshBasicMaterial({ map: tTex }));
tScreen.position.set(0.82, 1.78, -1.068);
elev.add(tScreen);
let tKey = '';
function drawTimer(label, text, warn) {
  const k = label + text + warn;
  if (k === tKey) return;
  tKey = k;
  const c = warn ? '#ff5a3c' : '#ffb34a';
  tctx.fillStyle = '#080503';
  tctx.fillRect(0, 0, 256, 128);
  tctx.fillStyle = c;
  tctx.globalAlpha = 0.75;
  tctx.font = "600 24px 'IBM Plex Sans KR', sans-serif";
  tctx.textAlign = 'center';
  tctx.fillText(label, 128, 32);
  tctx.globalAlpha = 1;
  tctx.shadowColor = c;
  tctx.shadowBlur = 14;
  tctx.font = "700 82px ui-monospace, Menlo, Consolas, monospace";
  tctx.fillText(text, 128, 108);
  tctx.shadowBlur = 0;
  tTex.needsUpdate = true;
}
drawTimer('', '--', false);
const hemi = new THREE.HemisphereLight(0x5a5046, 0x1a1612, 0.55);
scene.add(hemi);
const lightE = new THREE.PointLight(0xffe2b8, 1.0, 7, 1.5);
lightE.position.set(0, 2.2, 0);
scene.add(lightE);

/* ---------- the outside ---------- */
const outside = new THREE.Group();
scene.add(outside);
const outA = new THREE.PointLight(0xffd9a0, 1, 13, 1.4);
outA.position.set(0, 2.4, -3.5);
const outB = new THREE.PointLight(0xffd9a0, 1, 13, 1.4);
outB.position.set(0, 2.4, -8);
scene.add(outA, outB);

function env(e = {}) {
  const bg = e.bg !== undefined ? e.bg : 0x050505;
  scene.background.set(bg);
  const f = e.fog || [bg, 5, 16];
  scene.fog.color.set(f[0]); scene.fog.near = f[1]; scene.fog.far = f[2];
  const a = e.a || [0xffd9a0, 1], b = e.b || [0xffd9a0, 1];
  outA.color.set(a[0]); outA.intensity = a[1];
  outB.color.set(b[0]); outB.intensity = b[1];
}
function clearOutside() {
  while (outside.children.length) {
    const c = outside.children[0];
    outside.remove(c);
    disposeObj(c);

  if (rider && rider.exiting) removeRider();
  if (evt && evt.inst && evt.inst.stop) evt.inst.stop();
  evt = null;
  evtWalk = [];
  evtBlock = [];
  pickables.length = 0;
  clearOutside();
  outside.visible = false;
  env();
  state = 'moving';
  moveT = 0;
  moveDur = skipWait ? 0.6 : WAIT_TIME;
  skipWait = false;
  midDone = false;
  setHum(0.5);
  liftSfx();
  say('');
}
function closeDoors() {
  if (state !== 'open' && state !== 'opening') return;
  state = 'closing';
  doorTarget = 0;
  musicStart();
  if (pz < -0.85) {
    const f = $('fade');
    f.style.opacity = '1';
    setTimeout(() => { px = 0; pz = -0.2; f.style.opacity = '0'; }, 450);
  }
  sfx.door();
  say('');
}

/* ---------- piano ---------- */
let pianoKeys = [], pianoPlay = false, pianoOct = 0, pianoDown = null, pianoBadgeOn = false;
const heldNotes = {}, keyByMidi = {}, heldByCode = {};
const pbadge = $('pianobadge');
function setBadge() {
  if (!pianoBadgeOn || !pianoKeys.length) { pbadge.hidden = true; return; }
  pbadge.hidden = false;
  pbadge.textContent = pianoPlay
    ? "키보드 연주 중 · A S D F G H J K L ; ' · W E T Y U O P · Z X 옥타브 · Space로 이동 모드"
    : '건반을 누르면 소리가 납니다 · Space: 키보드 연주 모드';
}
function pianoOn(m) {
  if (!AC) return;
  if (heldNotes[m]) pianoOff(m);
  const f = 440 * Math.pow(2, (m - 69) / 12), t = AC.currentTime;
  const env = AC.createGain(), rel = AC.createGain(), lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(9000, f * 10), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(700, f * 2.5), t + 1.2);
  const oscs = [[1, 'triangle', 0.6], [2, 'sine', 0.25], [3, 'sine', 0.12], [4, 'sine', 0.05]].map(([k, type, a]) => {
    const o = AC.createOscillator(), og = AC.createGain();
    o.type = type; o.frequency.value = f * k; og.gain.value = a;
    o.connect(og).connect(lp);
    o.start(t);
    return o;
  });
  lp.connect(env).connect(rel).connect(master);
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(0.4, t + 0.008);
  env.gain.exponentialRampToValueAtTime(0.14, t + 0.35);
  env.gain.exponentialRampToValueAtTime(0.0008, t + 4);
  heldNotes[m] = { rel, oscs };
  setTimeout(() => oscs.forEach(o => { try { o.stop(); } catch (e) {} }), 4200);
}
function pianoOff(m) {
  const n = heldNotes[m];
  if (!n) return;
  delete heldNotes[m];
  const t = AC.currentTime;
  n.rel.gain.setTargetAtTime(0, t, 0.09);
  setTimeout(() => n.oscs.forEach(o => { try { o.stop(); } catch (e) {} }), 700);
}
function pressKey(k) {
  if (k.userData.down) return;
  k.userData.down = true;
  k.position.y = k.userData.y0 - 0.006;
  k.material.color.set(k.userData.pressed);
  pianoOn(k.userData.midi);
}
function releaseKey(k) {
  if (!k.userData.down) return;
  k.userData.down = false;
  k.position.y = k.userData.y0;
  k.material.color.set(k.userData.base);
  pianoOff(k.userData.midi);
}
function pianoReset() {
  pianoKeys.forEach(releaseKey);
  pianoKeys = [];
  for (const k in keyByMidi) delete keyByMidi[k];
  pianoPlay = false; pianoDown = null; pianoBadgeOn = false;
  setBadge();
}
function keyAtMouse() {
  if (!pianoKeys.length || (state !== 'open' && state !== 'opening')) return null;
  ctr.set(mouseX / wrapEl.clientWidth * 2 - 1, -(mouseY / wrapEl.clientHeight * 2 - 1));
  ray.setFromCamera(ctr, camera);
  ray.far = 4;
  const hits = ray.intersectObjects(pianoKeys, false);
  return hits.length ? hits[0].object : null;
}
const NOTE_KEYS = { KeyA: 60, KeyW: 61, KeyS: 62, KeyE: 63, KeyD: 64, KeyF: 65, KeyT: 66, KeyG: 67, KeyY: 68, KeyH: 69, KeyU: 70, KeyJ: 71, KeyK: 72, KeyO: 73, KeyL: 74, KeyP: 75, Semicolon: 76, Quote: 77 };

/* ---------- input ---------- */
let drag = false, lx = 0, ly = 0, moved = 0;
const keys = {};
stage.addEventListener('pointerdown', e => {
  setMouse(e);
  const pk = keyAtMouse();
  if (pk) { pianoDown = pk; pressKey(pk); try { stage.setPointerCapture(e.pointerId); } catch (_) {} return; }
  drag = true; moved = 0; lx = e.clientX; ly = e.clientY; try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  setMouse(e);
  if (pianoDown) {
    const nk = keyAtMouse();
    if (nk && nk !== pianoDown) { releaseKey(pianoDown); pianoDown = nk; pressKey(nk); }
    return;
  }
  if (!drag) return;
  moved += Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly);
  yaw -= (e.clientX - lx) * 0.0045;
  pitch = clamp(pitch - (e.clientY - ly) * 0.0045, -1.2, 1.2);
  lx = e.clientX; ly = e.clientY;
});
// a click: pick up the item under the mouse pointer, otherwise eat the pancake in hand
const endDrag = e => { if (e && e.clientX !== undefined) setMouse(e); if (pianoDown) { releaseKey(pianoDown); pianoDown = null; return; } if (drag && moved < 6) { if (targetPick()) tryPick(); else eatHeld(); } drag = false; };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('keydown', e => {
  if (pianoKeys.length) {
    if (e.code === 'Space') {
      e.preventDefault();
      pianoPlay = !pianoPlay;
      if (pianoPlay) for (const c in keys) keys[c] = false; else pianoKeys.forEach(releaseKey);
      setBadge();
      return;
    }
    if (pianoPlay) {
      if (e.code === 'KeyZ') { pianoOct = Math.max(-2, pianoOct - 1); return; }
      if (e.code === 'KeyX') { pianoOct = Math.min(2, pianoOct + 1); return; }
      const m = NOTE_KEYS[e.code];
      if (m !== undefined) {
        if (!e.repeat) { const k = keyByMidi[m + pianoOct * 12]; if (k) { heldByCode[e.code] = k; pressKey(k); } }
        return;
      }
    }
  }
  keys[e.code] = true;
  if (e.code === 'KeyE') tryPick();
  if (e.code === 'KeyF') eatHeld();
  const dm = /^Digit([1-4])$/.exec(e.code);
  if (dm) useSlot(+dm[1] - 1);
});
const joy = { x: 0, y: 0 };
{
  const el = $('joy'), knob = $('joyknob');
  let pid = null;
  const move = e => {
    const R = (el.offsetWidth - knob.offsetWidth) / 2;
    const r = el.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    const nx = dx / R, ny = dy / R;
    joy.x = Math.hypot(nx, ny) < 0.15 ? 0 : nx;
    joy.y = Math.hypot(nx, ny) < 0.15 ? 0 : ny;
  };
  const end = e => {
    if (pid === null || (e && e.pointerId !== pid)) return;
    pid = null; joy.x = 0; joy.y = 0;
    knob.style.transform = '';
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); pid = e.pointerId; try { el.setPointerCapture(pid); } catch (_) {} move(e); });
  el.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => el.addEventListener(t, end));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  const hk = heldByCode[e.code];
  if (hk) { releaseKey(hk); delete heldByCode[e.code]; }
});

$('howbtn').addEventListener('click', () => {
  const h = $('how'), on = !h.classList.contains('show');
  h.classList.toggle('show', on);
  $('howbtn').setAttribute('aria-expanded', on ? 'true' : 'false');
});
$('start').addEventListener('click', () => {
  audio();
  [vid, vid2, vid3, vid4].forEach(v => {
    v.muted = true;
    const pp = v.play();
    if (pp && pp.then) pp.then(() => { v.pause(); v.currentTime = 0; }).catch(() => {});
  });
  $('intro').classList.add('gone');
  $('joy').classList.add('show');
  invEl.hidden = false;
  hud.hidden = false;
  // boarding: the cabin stays shut for a 20 second cool-down before the first door opening
  state = 'moving';
  moveT = 0; moveDur = WAIT_TIME; midDone = false;
  setHum(0.5);
  liftSfx();
  musicStart();
});
{
  const fsb = $('fs'), de = document.documentElement;
  const coarse = window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches;
  const canFs = !!(document.fullscreenEnabled && de.requestFullscreen);
  let enteredFs = false;
  const unlock = () => { try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) {} };
  const setWide = on => {
    document.body.classList.toggle('wide', on);
    fsb.textContent = on ? '전체화면 해제' : '16:9 전체화면';
    if (on) {
      if (canFs) de.requestFullscreen().then(() => {
        enteredFs = true;
        try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
      }).catch(() => {});
    } else {
      enteredFs = false;
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      unlock();
    }
    resize();
  };
  const fsn = $('fsn');
  if (coarse && canFs) {
    fsn.hidden = false;
    fsn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else de.requestFullscreen().then(() => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fsn.textContent = document.fullscreenElement ? '전체화면 해제' : '전체화면'; });
  }
  if (coarse) {
    // Phones and tablets: 16:9 letterboxed full screen (landscape lock where the browser allows it).
    fsb.hidden = false;
    fsb.textContent = '16:9 전체화면';
    fsb.addEventListener('click', () => setWide(!document.body.classList.contains('wide')));
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && enteredFs && document.body.classList.contains('wide')) setWide(false);
    });
  } else if (canFs) {
    fsb.hidden = false;
    fsb.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else de.requestFullscreen().catch(() => {});
    });
    document.addEventListener('fullscreenchange', () => { fsb.textContent = document.fullscreenElement ? '전체화면 해제' : '전체화면'; });
  }
}
$('snd').addEventListener('click', e => {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.55;
  vid.muted = muted;
  vid2.muted = muted;
  vid3.muted = muted;
  vid4.muted = muted;
  e.currentTarget.textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  e.currentTarget.setAttribute('aria-pressed', String(!muted));
});

/* ---------- loop ---------- */
function runEvt(dt) {
  if (evt && evt.inst && evt.inst.update) evt.inst.update(evtT, dt);
  evtT += dt;
}
function update(dt, time) {
  if (keys.ArrowLeft) yaw += dt * 1.6;
  if (keys.ArrowRight) yaw -= dt * 1.6;
  if (keys.ArrowUp) pitch = clamp(pitch + dt * 1.2, -1.2, 1.2);
  if (keys.ArrowDown) pitch = clamp(pitch - dt * 1.2, -1.2, 1.2);

  // WASD walking, kept inside the cabin
  let mx = 0, mz = 0;
  if (keys.KeyW) mz -= 1;
  if (keys.KeyS) mz += 1;
  if (keys.KeyA) mx -= 1;
  if (keys.KeyD) mx += 1;
  let mag = 1;
  if (joy.x || joy.y) { mx = joy.x; mz = joy.y; mag = Math.min(1, Math.hypot(mx, mz)); }
  if (mx || mz) {
    const len = Math.hypot(mx, mz), sp = 1.7 * dt * mag / len;
    const c = Math.cos(yaw), sn = Math.sin(yaw);
    const nx = px + (mx * c + mz * sn) * sp, nz = pz + (-mx * sn + mz * c) * sp;
    if (canWalk(nx, pz)) px = nx;
    if (canWalk(px, nz)) pz = nz;
  }

  doorOpen += clamp(doorTarget - doorOpen, -dt, dt);
  const e = doorOpen * doorOpen * (3 - 2 * doorOpen);
  panelL.position.x = -0.275 - 0.55 * e;
  panelR.position.x = 0.275 + 0.55 * e;

  if (state === 'wait') { waitT -= dt; if (waitT <= 0) openDoors(); }
  else if (state === 'opening') { runEvt(dt); if (doorOpen >= 1) state = 'open'; }
  else if (state === 'open') {
    runEvt(dt);
    if (!warned && evtT >= evtDur() - 6) { warned = true; say('문이 곧 닫힌다.', 3500); }
    if (evtT >= evtDur()) closeDoors();
  }
  else if (state === 'closing') { runEvt(dt); if (doorOpen <= 0) beginMove(); }
  else if (state === 'moving') {
    moveT += dt;
    if (!midDone && moveT > moveDur * 0.5) {
      midDone = true;
      midFlicker = 0.55;
      for (let i = inside.length - 1; i >= 0; i--) {
        inside[i].left--;
        if (inside[i].left <= 0) { scene.remove(inside[i].obj); disposeObj(inside[i].obj); inside.splice(i, 1); }
      }
    }
    if (moveT >= moveDur) openDoors();
  }

  // elevator lights
  let li = 1;
  if (state === 'moving' && midFlicker > 0) { li = R() < 0.5 ? 0 : 0.3; midFlicker -= dt; }
  const targetDim = lightE.userData.dim ? 0.03 : 1;
  dimK += (targetDim - dimK) * Math.min(1, dt * 3);
  lightE.intensity = li * dimK;
  hemi.intensity = 0.55 * (0.1 + 0.9 * dimK);
  lampMat.emissiveIntensity = li * dimK;
  const moving = state === 'moving';
  btnMats.forEach((m, i) => { m.emissiveIntensity = moving ? (Math.sin(time * 3 + i * 1.7) > 0 ? 1 : 0.15) : 0.15; });

  // camera
  let sx = 0, sy = 0;
  // Gentle rumble: smaller and slower than the old shake so it does not cause motion sickness.
  if (moving) {
    sx = Math.sin(time * 17) * 0.004 + Math.sin(time * 7) * 0.003;
    sy = Math.sin(time * 21) * 0.004 + Math.sin(time * 5) * 0.002;
  }
  shake *= Math.exp(-dt * 6);
  if (shake > 0.001) { sx += (R() - 0.5) * shake; sy += (R() - 0.5) * shake; }
  camera.position.set(px + sx, 1.6 + sy, pz);
  camera.rotation.set(pitch, yaw, 0);

  updateRider(dt, time);
  updateMusic(time);
  updateVM(dt, time);
  const tp = targetPick();
  const hk = tp ? null : keyAtMouse();
  const hint = tp ? '클릭: ' + ITEMS[tp.userData.pick].name + ' 줍기' : (hk ? '클릭해서 연주' : (held && eatT < 0 ? '클릭해서 먹기' : ''));
  pickEl.textContent = hint;
  pickEl.style.opacity = hint ? '1' : '0';
  pickEl.style.left = mouseX + 'px';
  pickEl.style.top = mouseY + 'px';
  stage.style.cursor = tp || hk ? 'pointer' : '';

  // countdown screen
  if (state === 'open' || state === 'opening') {
    const r = Math.max(0, Math.ceil(evtDur() - evtT));
    drawTimer('열림', String(r).padStart(2, '0'), r <= 6);
  } else if (state === 'closing') drawTimer('닫힘', '00', true);
  else if (state === 'moving') drawTimer('대기', String(Math.max(0, Math.ceil(moveDur - moveT))).padStart(2, '0'), false);
  else drawTimer('', '--', false);

}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  update(dt, now / 1000);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
